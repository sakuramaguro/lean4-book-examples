name: Volume 4 reader examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volume4-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-volume4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the separate Volume 4 toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean-volume4
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Fetch the pinned dependency cache used by Volume 4
        working-directory: lean-volume4
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
        run: |
          lake exe cache get \
            BrownianMotion.Gaussian.BrownianMotion \
            Mathlib.Probability.Martingale.Basic \
            Mathlib.Probability.Distributions.Uniform \
            Mathlib.Probability.ProbabilityMassFunction.Integrals \
            Mathlib.Probability.Process.Adapted \
            Mathlib.MeasureTheory.Function.LpSeminorm.Basic \
            Mathlib.Algebra.BigOperators.Fin \
            Mathlib.Tactic.FinCases Mathlib.Tactic.Ring Mathlib.Tactic.NormNum \
            Mathlib.Probability.HasLaw \
            Mathlib.Probability.Distributions.Gaussian.HasGaussianLaw.Basic \
            Mathlib.Probability.Distributions.Gaussian.Real \
            Mathlib.Probability.Independence.Integration \
            Mathlib.Probability.ConditionalExpectation \
            Mathlib.MeasureTheory.Integral.IntervalIntegral.Basic
      - name: Build, audit and check every distributed Volume 4 example
        working-directory: lean-volume4
        run: python3 scripts/verify_reader.py
      - name: Save reader verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: volume4-reader-verification
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            lean-volume4/.generated/*.json
            lean-volume4/.generated/logs/
